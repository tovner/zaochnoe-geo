<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>2 триместр · 6 класс · География</title>
<style>
:root{--ink:#142a3d;--muted:#52677b;--blue:#165fc7;--line:#d5e1ec;--bg:#eef4fa}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.65 Arial,sans-serif}a{color:var(--blue)}
.topbar{background:#102b44;color:#fff;padding:16px max(20px,calc((100% - 900px)/2));display:flex;justify-content:space-between;align-items:center;gap:12px}.topbar a{color:#fff;text-decoration:none;font-weight:800}.topbar span{color:#b4d1ed;font-size:14px}
.page{max-width:900px;margin:auto;padding:28px 20px 60px}.eyebrow{color:var(--blue);font-size:13px;font-weight:900;letter-spacing:.12em;text-transform:uppercase}
h1{font-size:clamp(28px,4vw,40px);margin:8px 0 4px}h2{font-size:23px;margin:30px 0 10px}.intro{font-size:18px;color:var(--muted);margin:8px 0 18px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin:16px 0}.card p{margin:0 0 12px}.card p:last-child{margin:0}
.goals{background:#eef7ff;border:1px solid #bdd8f3;border-radius:14px;padding:18px 22px;margin:18px 0 26px}.goals h2{font-size:19px;margin:0 0 8px}.goals ul{margin:0}
.terms{background:#f2f7fc;border-left:5px solid var(--blue);border-radius:0 12px 12px 0;padding:14px 18px;margin:20px 0}.selfcheck{background:#fff8e8;border:1px solid #efd18b;border-radius:14px;padding:16px 20px;margin:24px 0}.selfcheck summary{cursor:pointer;font-weight:800;color:#704f00}
.tasknav{display:flex;justify-content:space-between;gap:10px;margin-top:26px;flex-wrap:wrap}.tasknav a{font-weight:800}.source,footer{color:var(--muted);font-size:14px}.mobile-back{display:none}ul,ol{padding-left:22px}li{margin:6px 0}
@media(max-width:700px){.topbar{padding:14px 18px}.topbar span{display:none}.page{padding:24px 16px 70px}.card{padding:17px}.mobile-back{display:inline-flex;position:fixed;left:14px;bottom:14px;z-index:50;align-items:center;min-height:44px;padding:9px 15px;border-radius:999px;background:var(--blue);color:#fff;text-decoration:none;font-weight:800;box-shadow:0 6px 20px #142a3d44}}
@media print{.topbar,.tasknav,.mobile-back{display:none}.page{max-width:none;padding:0}.card,.goals,.selfcheck,.terms{break-inside:avoid}}
</style></head><body>
<header class="topbar"><a href="../../index.html">Все классы</a><a href="../index.html">6 класс</a><span>2 триместр</span></header>
<a class="mobile-back" href="../index.html" aria-label="Вернуться к списку тем 6 класса">← К темам</a>
<main class="page"><div class="eyebrow" id="eyebrow"></div><h1 id="title"></h1><p class="intro" id="intro"></p><div class="goals"><h2>После изучения темы ты сможешь</h2><ul id="goals"></ul></div><div id="content"></div><details class="selfcheck"><summary>Проверь себя</summary><ol id="questions"></ol></details><div class="terms" id="terms"></div><p class="source" id="source"></p><nav class="tasknav" id="tasknav"></nav><footer>Заочное обучение · 6 класс · 2 триместр<span style="display:block;margin-top:4px;font-size:10px;opacity:.35">Сайт создан Пендюриным В. Ю.</span></footer></main>
<script src="topics.js"></script><script>
const ids=Object.keys(topics).sort((a,b)=>Number(a)-Number(b)),key=new URLSearchParams(location.search).get('topic')||'08',i=ids.indexOf(key),current=topics[key];
if(!current){location.replace('index.html?topic=08')}else{
 const put=(id,value)=>document.getElementById(id).innerHTML=value;
 document.title=current.title+' · 6 класс · 2 триместр';
 put('eyebrow','Заочное обучение · 6 класс · 2 триместр · Тема '+key);
 put('title',current.title);put('intro',current.intro);
 put('goals',current.goals.map(x=>'<li>'+x+'</li>').join(''));
 put('content',current.sections.map(([title,text])=>'<section><h2>'+title+'</h2><div class="card"><p>'+text+'</p></div></section>').join(''));
 put('questions',current.questions.map(x=>'<li>'+x+'</li>').join(''));
 put('terms','<b>Запомни:</b> '+current.terms);
 put('source','Основа темы: предоставленный материал 06.'+key+'.');
 put('tasknav',(i?'<a href="?topic='+ids[i-1]+'">← Тема '+ids[i-1]+'</a>':'<span></span>')+(i<ids.length-1?'<a href="?topic='+ids[i+1]+'">Тема '+ids[i+1]+' →</a>':'<a href="../index.html">К списку тем →</a>'));
}
</script></body></html>

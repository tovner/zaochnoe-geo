<script>
const topics={
08:{title:'Форма и размеры Земли',intro:'Почему Земля кажется плоской, хотя имеет почти шарообразную форму, и как её форма влияет на природу?',goals:['объяснять, что такое геоид и почему Земля не идеальный шар','называть примерные размеры Земли','объяснять, почему на разных широтах неодинаково тепло'],sections:[
['Как узнали форму Земли','На небольшом участке поверхность кажется плоской, поэтому в древности люди представляли Землю плоским диском. Наблюдения постепенно изменили представления: при удалении корабля за горизонтом сначала исчезает корпус, а затем мачта; во время лунного затмения тень Земли на Луне круглая. Древнегреческий учёный Эратосфен оценил длину земной окружности, сравнив положение Солнца в разных городах. Сегодня форму Земли подтверждают снимки из космоса.'],
['Размеры и геоид','Земля немного сплюснута у полюсов, а её поверхность неровная. Поэтому её форму называют геоидом. Экваториальный радиус около 6378 км, полярный — около 6357 км; первый длиннее примерно на 21 км. Длина экватора — около 40 тысяч километров, площадь поверхности — около 510 млн км². Земля — пятая по размеру среди восьми планет Солнечной системы.'],
['Что следует из формы Земли','Солнечные лучи у экватора обычно падают более отвесно и нагревают меньшую площадь, а у полюсов — более косо и распределяют ту же энергию по большей площади. Поэтому в общем случае от экватора к полюсам становится холоднее. На климат также влияют облачность, поверхность, океанические течения и высота местности.'],
['Луна — спутник Земли','Луна находится в среднем примерно в 384 тысячах километров от Земли. Она обращается вокруг нашей планеты и повёрнута к нам почти одной стороной: время её оборота вокруг оси примерно равно времени обращения вокруг Земли. Смена видимой освещённой части Луны называется фазами; от новолуния до следующего новолуния проходит около 29,5 суток. Тёмные «моря» Луны — это не водоёмы, а древние лавовые равнины.']],terms:'Геоид · экватор ≈ 40 000 км · экваториальный радиус больше полярного · Луна ≈ 384 000 км · фазы Луны.',questions:['Почему Земля кажется плоской человеку на поверхности?','Какой радиус больше — экваториальный или полярный?','Почему ближе к экватору обычно теплее?','Что называют фазами Луны?']},
09:{title:'Движения Земли',intro:'Два движения Земли объясняют смену дня и ночи, год и времена года.',goals:['различать вращение вокруг оси и обращение вокруг Солнца','связывать сутки и год с движениями Земли','объяснять причину смены времён года'],sections:[
['Вращение вокруг оси','Земная ось — воображаемая линия через Северный и Южный полюса. Земля вращается вокруг неё с запада на восток. Полный оборот относительно Солнца занимает примерно 24 часа — солнечные сутки. На обращённой к Солнцу стороне день, на противоположной ночь. Из-за вращения Солнце кажется движущимся по небу с востока на запад; разные меридианы встречают полдень в разное время.'],
['Обращение вокруг Солнца','Земля движется вокруг Солнца по орбите. Один оборот длится около 365 суток и 6 часов. Поэтому календарный год обычно содержит 365 суток, а примерно раз в четыре года добавляется 29 февраля. Такой год называют високосным. Орбита слегка вытянута, но перемена расстояния до Солнца не является главной причиной сезонов.'],
['Откуда берутся времена года','Ось Земли наклонена к плоскости орбиты под углом около 66,5° (или на 23,5° от перпендикуляра к ней). При движении Земли вокруг Солнца ось сохраняет почти одно направление. В июне Северное полушарие обращено к Солнцу сильнее: день длиннее, лучи падают отвеснее, здесь лето. В декабре лучше освещено Южное полушарие. Когда в одном полушарии лето, в другом зима.'],
['Другие следствия','Вращение Земли связано с суточным ритмом жизни растений и животных. Оно также влияет на направление ветров и океанических течений: в Северном полушарии движущиеся массы отклоняются вправо, в Южном — влево. Для понимания сезонов сначала выясняй, какое полушарие лучше освещено, а не насколько Земля близка к Солнцу.']],terms:'Ось · сутки ≈ 24 ч · год ≈ 365 суток 6 ч · високосный год · наклон оси 23,5° от перпендикуляра.',questions:['Какое движение вызывает смену дня и ночи?','Почему возникает високосный год?','Почему в декабре в Австралии лето?','Станут ли сезоны одинаковыми, если убрать наклон оси?']},
10:{title:'Солнечный свет на Земле',intro:'Разберись, почему лучи Солнца по-разному освещают широты и что означают особые линии на карте.',goals:['сравнивать угол падения лучей у экватора и полюсов','находить тропики и полярные круги','различать равноденствие и солнцестояние'],sections:[
['Угол падения солнечных лучей','Чем ближе лучи к отвесному падению, тем сильнее нагревается поверхность: энергия сосредоточена на меньшей площади. При косом падении она распределяется по большей площади. Поэтому в общем случае количество тепла уменьшается от экватора к полюсам. «Солнце в зените» означает, что в полдень оно находится прямо над головой, а тень от вертикального предмета почти исчезает.'],
['Тропики и полярные круги','Северный и Южный тропики проходят примерно по широтам 23,5° с. ш. и 23,5° ю. ш. Только между ними Солнце может оказаться в зените. Полярные круги проходят примерно по 66,5° с. ш. и ю. ш. За ними бывают полярный день, когда Солнце не заходит, и полярная ночь, когда оно не поднимается над горизонтом. Белые ночи в Санкт-Петербурге не равны полярному дню: Солнце всё же ненадолго заходит.'],
['Пояса освещённости','Между тропиками находится жаркий пояс, между тропиками и полярными кругами — два умеренных, а за полярными кругами — два полярных. В умеренных поясах заметно различаются времена года. В полярных выражены очень большие сезонные изменения длины дня. Границы поясов проводят по параллелям, а не по государственным границам.'],
['Четыре важные даты','Около 20–21 марта и 22–23 сентября бывают равноденствия: Солнце в зените над экватором, день и ночь близки по продолжительности. Около 20–21 июня и 21–22 декабря бывают солнцестояния: Солнце в зените над соответствующим тропиком, а в одном из полушарий день достигает наибольшей или наименьшей продолжительности. Точная календарная дата может отличаться от года к году.']],terms:'Зенит · тропики 23,5° · полярные круги 66,5° · 5 поясов освещённости · равноденствие · солнцестояние.',questions:['Почему косые лучи нагревают слабее?','Может ли Солнце быть в зените над Санкт-Петербургом?','Где бывают полярный день и ночь?','Что происходит в дни равноденствия?']},
11:{title:'Часовые пояса',intro:'Земля вращается, поэтому полдень наступает в разных местах в разное время.',goals:['объяснять различие местного и поясного времени','решать простые задачи на разницу во времени','находить линию перемены дат'],sections:[
['Местное солнечное время','Когда Солнце находится примерно выше всего над горизонтом, наступает местный полдень. У пунктов на одном меридиане местное солнечное время близко, а у пунктов на разных меридианах отличается. Земля поворачивается на 360° за 24 часа, то есть на 15° за час и на 1° за 4 минуты. Поэтому жить по собственному солнечному времени каждого города неудобно.'],
['Поясное время и часовые зоны','Землю условно делят на 24 пояса шириной около 15° долготы. Время внутри пояса одинаково, а соседние пояса отличаются примерно на час. Отсчёт связан с нулевым, или Гринвичским, меридианом. В реальности границы гражданских часовых зон часто отклоняются от меридианов, чтобы не делить страны и области между разными временами. Не путай учебную схему поясов с действующими границами зон.'],
['Как считать разницу','При движении на восток время увеличивается, на запад — уменьшается. Например, если в условной зоне UTC+3 12:00, то в зоне UTC+5 14:00, а в UTC+1 10:00. Сначала найди разницу между обозначениями зон, затем прибавь или вычти её. Если результат пересекает полночь, меняется и дата.'],
['Линия перемены дат','Линия проходит вблизи меридиана 180°, огибая некоторые территории. При пересечении с запада на восток дату уменьшают на сутки, с востока на запад — прибавляют. Это нужно, чтобы после кругосветного путешествия календарь оставался согласованным. Новый день сначала приходит к районам по восточную сторону линии, а затем продвигается на запад.']],terms:'360° / 24 ч = 15° за час · на восток время прибавляется · на запад вычитается · линия перемены дат ≈ 180°.',questions:['Зачем понадобились часовые зоны?','Сколько градусов долготы соответствует одному часу?','Если в UTC+3 15:00, сколько в UTC+6?','Что меняется при пересечении линии перемены дат?']},
12:{title:'Ориентирование на местности',intro:'Научись находить стороны горизонта и задавать точное направление движения.',goals:['называть главные и промежуточные стороны горизонта','пользоваться компасом','объяснять, что такое азимут'],sections:[
['Стороны горизонта','Ориентироваться — значит определять своё положение и направления относительно сторон горизонта. Главные стороны: север, юг, восток, запад; промежуточные: северо-восток, юго-восток, юго-запад, северо-запад. На обычном плане север вверху, восток справа, но на карте сначала нужно проверить ориентировку и меридианы.'],
['Компас и надёжные ориентиры','Магнитная стрелка компаса указывает примерно направление север—юг; северный конец отмечен цветом или буквой N. Держи компас горизонтально и вдали от металлических предметов и магнитов. Можно ориентироваться по Полярной звезде: в Северном полушарии она находится близко к направлению на север. По Солнцу восток и запад определяют лишь приблизительно: точки восхода и заката меняются по сезонам.'],
['Азимут','Азимут — угол от направления на север до направления на объект, отсчитываемый по часовой стрелке от 0° до 360°. Северу соответствует 0° или 360°, востоку 90°, югу 180°, западу 270°. Например, объект на северо-востоке имеет азимут около 45°. На практике компас помогает удерживать направление, когда нужный объект скрыт деревьями или зданиями.'],
['Если нет приборов','Природные признаки — мох на стволах, кроны деревьев, муравейники — ненадёжны по отдельности: на них влияют тень, влажность и рельеф. Проверяй сразу несколько признаков, а лучше используй компас, карту или навигационное устройство. Перед выходом в незнакомую местность сообщи маршрут взрослым.']],terms:'Север 0° · восток 90° · юг 180° · запад 270° · азимут отсчитывают по часовой стрелке.',questions:['Назови четыре главные и четыре промежуточные стороны горизонта.','Почему компас нужно держать вдали от металла?','Каков азимут направления на юг?','Почему мох нельзя считать точным компасом?']},
13:{title:'Земная поверхность на карте',intro:'Карты показывают не только расположение объектов, но и высоту и форму земной поверхности.',goals:['различать абсолютную и относительную высоту','читать горизонтали и бергштрихи','объяснять условные знаки и легенду'],sections:[
['Рельеф и высоты','Рельеф — совокупность неровностей земной поверхности: гор, равнин, холмов и впадин. Абсолютную высоту измеряют от принятого нулевого уровня моря; в России традиционно используют уровень Балтийского моря у Кронштадта. Относительная высота показывает, насколько одна точка выше или ниже другой. Если вершина имеет отметку 180 м, а подножие 120 м, относительная высота холма — 60 м.'],
['Горизонтали на плане','Горизонтали, или изогипсы, соединяют точки одинаковой абсолютной высоты. Чем ближе линии друг к другу, тем склон круче; чем дальше — тем положе. Короткие штрихи на горизонталях — бергштрихи — указывают направление понижения склона. Если штрихи направлены наружу замкнутых горизонталей, перед тобой холм; если внутрь — впадина. Подписанная точка показывает высоту конкретного места.'],
['Цвета на физической карте','На физической карте интервалы высот и глубин передают оттенками. Зелёные тона обычно соответствуют низменностям, коричневые — более высоким участкам суши, синие — воде и глубинам. Но точное значение любого цвета ищи только в легенде именно этой карты. Нельзя считать, что один и тот же оттенок всегда означает одну и ту же высоту.'],
['Условные знаки','Легенда объясняет смысл цветов, линий, значков и стрелок. Точечные значки показывают небольшие по размеру объекты, линейные — реки и дороги, площадные — леса и озёра. Стрелками передают движение, а изолиниями соединяют места с одинаковым значением показателя, например одинаковой температурой.']],terms:'Рельеф · абсолютная высота от уровня моря · относительная высота между точками · горизонтали · бергштрихи · легенда.',questions:['Чем абсолютная высота отличается от относительной?','Где склон круче: при частых или редких горизонталях?','Что показывают бергштрихи?','Где узнать значение цвета на физической карте?']},
14:{title:'Практическая работа «Масштаб»',intro:'Масштаб помогает перевести расстояние на карте в расстояние на местности.',goals:['читать численный, именованный и линейный масштаб','переводить сантиметры в метры и километры','находить реальные расстояния по карте'],sections:[
['Что показывает масштаб','Масштаб показывает, во сколько раз изображение уменьшено. Запись 1:100 000 означает: 1 см на карте соответствует 100 000 см на местности. Это 1000 м, или 1 км. В численном масштабе обе части отношения сначала выражены в одинаковых единицах. Чем меньше знаменатель при одинаковой записи, тем крупнее масштаб и подробнее изображение.'],
['Три формы записи','Численный масштаб записывают отношением, например 1:50 000. Именованный записывают словами: «в 1 см 500 м». Линейный — это размеченная шкала, по которой расстояние удобно отсчитывать линейкой или циркулем. Эти формы описывают одно и то же соотношение, поэтому их можно переводить друг в друга.'],
['Перевод масштаба','Чтобы перейти от сантиметров к метрам, дели знаменатель на 100; к километрам — на 100 000. Например, 1:20 000 означает в 1 см 200 м, а 1:5 000 000 — в 1 см 50 км. Обратно: «в 1 см 10 км» = 1:1 000 000, потому что 10 км содержат миллион сантиметров. Не просто отбрасывай нули: сначала проверь единицы измерения.'],
['Измерение расстояния','Измерь расстояние между объектами по прямой линейкой, затем умножь число сантиметров на значение именованного масштаба. Например, 3 см при масштабе «в 1 см 2 км» дают 6 км. Если нужен путь по извилистой дороге, измеряй её по частям или нитью; расстояние по прямой будет меньше длины дороги. Проверяй, что конечный ответ записан в требуемых единицах.']],terms:'1 км = 100 000 см · 1 м = 100 см · реальное расстояние = расстояние на карте × величина масштаба.',questions:['Что означает масштаб 1:200 000?','Переведи 1:500 000 в именованный масштаб.','Как записать численно «в 1 см 100 м»?','Чему равны 4 см на карте, если в 1 см 3 км?']},
15:{title:'Географическая карта',intro:'Карта — удобная модель Земли, но для её чтения нужно понимать масштаб, условные знаки и искажения.',goals:['различать виды карт по содержанию и охвату','сравнивать карту с планом и глобусом','объяснять, почему плоская карта искажает поверхность'],sections:[
['Что такое географическая карта','Это уменьшенное и обобщённое изображение всей Земли или её части на плоскости с помощью условных знаков. Карта имеет масштаб и математическую основу — градусную сетку из параллелей и меридианов. По охвату показывают мир, материк, страну или город; по назначению карты бывают учебными, дорожными, навигационными и другими.'],
['Виды карт','Общегеографические карты показывают разные объекты и явления: рельеф, воды, населённые пункты, дороги. Тематическая карта сосредоточена на одной теме, например климате или населении. Карты различают и по масштабу: крупномасштабные подробнее показывают небольшой район, мелкомасштабные — большие территории с меньшими подробностями. Контурная карта оставляет основу, чтобы ученик нанёс содержание сам.'],
['Карта, план и глобус','План обычно охватывает маленький участок в крупном масштабе и подробно показывает местность; карта может охватывать гораздо большую территорию и содержит градусную сетку. Глобус — объёмная модель Земли. Он наглядно сохраняет форму планеты и меньше искажает очертания, но менее удобен для подробного изображения небольшого района и для переноски.'],
['Почему бывают искажения','Шарообразную поверхность невозможно развернуть на плоскости без растяжения или разрывов. Поэтому на любой плоской карте что-то искажается: длины, площади, формы или углы. Картографическая проекция — способ построения изображения, который позволяет выбрать, какие искажения уменьшить для конкретной задачи. По одной только форме объектов на карте нельзя без проверки сравнивать их реальные площади.']],terms:'Карта · масштаб · градусная сетка · общегеографическая и тематическая карты · проекция · искажения.',questions:['Чем тематическая карта отличается от общегеографической?','Что есть на карте, но обычно отсутствует на плане?','Почему глобус точнее передаёт форму Земли?','Какие свойства могут искажаться на плоской карте?']},
16:{title:'План местности. Съёмка местности',intro:'План помогает подробно показать небольшой участок и измерить расположение объектов.',goals:['читать условные знаки плана','различать глазомерную, полярную и маршрутную съёмку','составлять простой план местности'],sections:[
['Что показывает план','План местности — уменьшенный чертёж небольшого участка земной поверхности с условными знаками. Он обычно имеет крупный масштаб и позволяет определить взаимное положение зданий, дорог, водоёмов и других объектов. Север, если нет специального указания, обычно показывают в верхней части листа. Высоты на подробном плане могут показываться горизонталями и отметками.'],
['Условные знаки плана','Масштабные знаки показывают площадь объектов, которую можно выразить в масштабе: леса, поля, озёра. Внемасштабные обозначают маленькие объекты, размеры которых на чертеже были бы незаметны: отдельное дерево, колодец, башню. Линейными показывают вытянутые объекты: дороги, тропы, ручьи. Их ширина на плане часто условна, а длину можно измерить по масштабу. Все обозначения сверяй с легендой.'],
['Глазомерная съёмка','Съёмка местности — сбор измерений для составления плана. Для простой глазомерной съёмки нужны бумага на планшете, карандаш, компас и средство измерения расстояний. Можно считать шаги, но заранее нужно узнать среднюю длину своего шага. Результат приблизителен; для точных работ используют специальные приборы.'],
['Полярная и маршрутная съёмка','При полярной съёмке наблюдатель остаётся в одной точке и отмечает направления и расстояния до видимых объектов. Маршрутная съёмка удобна для вытянутого участка: наблюдатель движется по маршруту, измеряет отрезки, отмечает каждый поворот и новое направление. После измерений объекты наносят на бумагу в выбранном масштабе и подписывают условные знаки.']],terms:'План · крупный масштаб · масштабные, внемасштабные и линейные знаки · глазомерная, полярная и маршрутная съёмка.',questions:['Чем план отличается от карты мира?','Каким знаком показать отдельный колодец?','Когда удобна полярная съёмка?','Какие данные нужно записывать на поворотах маршрута?']},
17:{title:'Определение азимута и направлений на карте',intro:'Закрепи стороны горизонта и научись точно измерять направление от одной точки к другой.',goals:['находить север на плане и карте','измерять азимут транспортиром','сравнивать прямой и обратный азимут'],sections:[
['Как устроен азимут','Азимут — угол от направления на север до линии на нужный объект, отсчитываемый по часовой стрелке. Его измеряют в градусах от 0° до 360°. Север — 0° (или 360°), северо-восток — 45°, восток — 90°, юго-восток — 135°, юг — 180°, юго-запад — 225°, запад — 270°, северо-запад — 315°.'],
['Измерение на плане','Поставь центр транспортира в начальную точку. Проведи от неё луч на север и луч к конечной точке. От северного луча по часовой стрелке измерь угол до луча на цель — это азимут движения. На обычном плане север расположен вверху, но сначала проверь стрелку севера. Если объект ровно справа от начальной точки, азимут равен 90°.'],
['Направления на географической карте','На карте север не всегда совпадает с верхом листа. Направление на север определяют по меридиану в данной точке в сторону Северного полюса; восток — по параллели в сторону увеличения восточной долготы. На карте с необычной проекцией линии могут быть изогнуты, поэтому нельзя автоматически принять край листа за направление. Для простых учебных задач сначала найди градусную сетку, потом оцени направление между точками.'],
['Обратный путь и практическая проверка','Если нужно вернуться по той же прямой, обратный азимут отличается на 180°: к азимуту меньше 180° прибавь 180°, из азимута 180° и больше вычти 180°. Например, путь на восток — 90°, обратно на запад — 270°. На местности магнитный компас может показывать направление, немного отличающееся от направления на географический север; для точных измерений учитывают магнитное склонение.']],terms:'Север 0° · восток 90° · юг 180° · запад 270° · обратный азимут отличается на 180°.',questions:['Как отсчитывают азимут?','Какой азимут у направления на юго-запад?','Как определить север на географической карте?','Каков обратный азимут для 45°?']}
};
